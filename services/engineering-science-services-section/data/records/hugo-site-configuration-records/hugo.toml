# Example site for 561-hugo-theme.
# Build locally from this directory:  hugo server
# Output goes to ./public/ (Hugo default).

baseURL = 'https://example.com/'
locale = 'en-us'
title = '561-hugo-theme example site'

themesDir = "../.."
theme = "561-hugo-theme"

disableAliases = true
ignoreErrors = ["deprecated", "error-deprecated", "error-output-format"]

[taxonomies]
  tag = "tags"
  type = "types"
  author = "authors"

[params]
  # Params a consuming site would set live here.

[frontmatter]
  date = ["date", "date-created", ":git", ":default"]

[markup.goldmark]
  [markup.goldmark.extensions]
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['$$', '$$']]
        inline = [['$', '$']]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser]
    [markup.goldmark.parser.attribute]
      block = false
