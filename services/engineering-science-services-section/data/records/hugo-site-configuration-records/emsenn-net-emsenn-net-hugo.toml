baseURL = 'https://emsenn.net/'
locale = 'en-us'
title = 'emsenn.net'

themesDir = ".."
theme = "561-hugo-theme"

publishDir = "../../../../../../science/publications/websites/emsenn-net"

# Skip directories that contain non-content files (archetypes, themes, etc.)
ignoreFiles = ['archetypes/', 'skills/', '\.claude/agents/', 'archive/', 'themes/', 'triage/', 'prompts/', 'slop', '\.j2$', 'SKILL[^/]*\.md$', 'AGENTS?\.md$', 'relationality/', 'tools/build/', 'operations/']
disableAliases = true
ignoreErrors = ["deprecated", "error-deprecated", "error-output-format"]

# Mount existing content directories into Hugo's content tree
[[module.mounts]]
  source = "content"
  target = "content"

[[module.mounts]]
  source = "../../../../../../../library"
  target = "content/library"

[[module.mounts]]
  source = "../../../../../../command/personnel/emsenn/content/writing/letters/web"
  target = "content/writing/letters"

[[module.mounts]]
  source = "../../../../../../command/personnel/emsenn/logs"
  target = "assets/log-source"

# Keep the default static/layouts/etc working
[[module.mounts]]
  source = "static"
  target = "static"

[[module.mounts]]
  source = "layouts"
  target = "layouts"

[mediaTypes."text/turtle"]
  suffixes = ["ttl"]

[mediaTypes."application/ld+json"]
  suffixes = ["jsonld"]

[mediaTypes."application/feed+json"]
  suffixes = ["json"]

[outputFormats.ttl]
  mediaType = "text/turtle"
  baseName = "index"
  isPlainText = true
  rel = "alternate"

[outputFormats.jsonld]
  mediaType = "application/ld+json"
  baseName = "index"
  isPlainText = true
  rel = "alternate"

[outputFormats.jsonfeed]
  mediaType = "application/feed+json"
  baseName = "feed"
  isPlainText = true
  rel = "alternate"

[outputs]
  home = ["html", "rss", "ttl", "jsonld", "jsonfeed"]
  section = ["html", "rss", "ttl", "jsonld"]
  page = ["html", "ttl", "jsonld"]

[taxonomies]
  tag = "tags"
  type = "types"
  author = "authors"

[params]
  email = "emsenn@emsenn.net"
  tribalHeritage = "Itazipcho (Sans Arc of the Lakota Sioux)"
  genderIdentity = "queer"
  showHCard = true
  properName = "emsenn"
  pronounNominative = "they"
  pronounOblique = "them"
  pronounPossessive = "theirs"
  honorificPrefix = "M"
  canonicalURL = "https://emsenn.net"
  nickname = "emsenn"
  logo = "/imgs/emsenn-logotype.png"
  logoAlt = "The text '(ems), representing emsenn's logotype."
  givenName = "Morgan"
  familyName = "Sennhauser"
  locality = "North Shore of Gitchigumee"
  region = "Minnesota"
  country = "United States of America"
  traditionalSovereignty = "Ojibwe"
  webmentions = true

[frontmatter]
  date = ["date", "date-created", ":git", ":default"]

[markup.goldmark]
  [markup.goldmark.extensions]
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['$$', '$$']]
        inline = [['$', '$']]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser]
    [markup.goldmark.parser.attribute]
      block = false
