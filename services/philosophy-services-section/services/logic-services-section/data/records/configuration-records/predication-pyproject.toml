[project]
name = "predication-categories"
version = "0.1.0"
description = "Computational primitives + per-note verification modules for the predication-categories corpus."
requires-python = ">=3.11"
dependencies = [
    "sympy>=1.12",
]

[tool.pytest.ini_options]
testpaths = ["."]
# Permissive file pattern: discover all .py modules in the package (per-note
# modules can use any naming convention matching the corpus markdown slug).
# Filter to test_* functions only.
python_files = ["*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
strict = true
files = ["primitives/**/*.py", "link.py"]
