id: write-content-unit
description: "Write a content unit (MathUnit, SpecUnit, Skill, etc.) to the DB and flush to its source file on disk."
skill-closure-kind: process

inputs:
  - name: kind
    type: str        # MathUnit | SpecUnit | Skill | ...
  - name: department
    type: str
  - name: unit_id
    type: str        # the id field (typically file stem)
  - name: description
    type: str
  - name: body
    type: str
  - name: source_path
    type: str        # relative path from repo root, e.g. spec/unit.md

steps:
  - id: write-unit
    type: write
    kind: "{{inputs.kind}}"
    department: "{{inputs.department}}"
    flush: true
    content:
      id: "{{inputs.unit_id}}"
      description: "{{inputs.description}}"
      body: "{{inputs.body}}"
      source_path: "{{inputs.source_path}}"
