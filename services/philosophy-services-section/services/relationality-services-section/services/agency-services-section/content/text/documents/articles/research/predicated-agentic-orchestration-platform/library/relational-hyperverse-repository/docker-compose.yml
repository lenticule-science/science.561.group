services:
  engine:
    image: python:3.12-slim
    container_name: rh-engine
    working_dir: /repo
    command: python3 -m src.engine.mcp_server
    volumes:
      - .:/repo
      - engine-db:/repo/src/engine
    ports:
      - "8765:8765"
    env_file:
      - .env
    environment:
      - MCP_TRANSPORT=sse
      - MCP_PORT=8765
    restart: unless-stopped
    # Install deps on start if needed; prefer building a proper image later
    entrypoint: >
      sh -c "pip install -q -r requirements.txt && python3 -m src.engine.mcp_server"

  dev:
    build:
      context: ./proof/RelationalHyperverse
      dockerfile: Dockerfile
    container_name: rh-dev
    volumes:
      # Full repo bind-mounted — edits on host are immediately visible inside.
      - .:/repo
      # Persist Claude auth tokens and session history across container restarts.
      - claude-data:/root/.claude
    ports:
      # SSH on localhost:2222 only. Tailscale on the host handles remote access.
      - "127.0.0.1:2222:22"
    env_file:
      - .env
    restart: unless-stopped

volumes:
  claude-data:
  engine-db:
