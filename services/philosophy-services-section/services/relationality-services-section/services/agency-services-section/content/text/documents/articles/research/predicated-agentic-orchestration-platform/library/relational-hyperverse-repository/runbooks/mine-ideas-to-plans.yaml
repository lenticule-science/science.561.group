id: mine-ideas-to-plans
description: "Promote actionable Ideas from IDEAS.md into WorkItems in PLANS.md. Uses LLM to decide if an idea is ready and to write the action statement."
skill-closure-kind: procedure

inputs:
  - name: department
    type: str

steps:
  - id: load-ideas
    type: query
    kind: Idea
    department: "{{inputs.department}}"
    where:
      done: false

  - id: evaluate-each
    type: for-each
    over: "{{load-ideas.result}}"
    do:
      - id: decide
        type: llm-call
        system_prompt: "skills/mine-idea.md"
        user_input: "{{item.text}}"
        result_type: IdeaDecision

      - id: promote
        type: write
        condition: "{{decide.result.promote}}"
        kind: WorkItem
        department: "{{inputs.department}}"
        flush: false
        content:
          identifier: "{{decide.result.identifier}}"
          added: "{{today}}"
          status: open
          action: "{{decide.result.action}}"
          why: "{{item.text}}"
          why_blocked: ""

      - id: mark-done
        type: update
        condition: "{{decide.result.promote}}"
        unit_id: "{{item.id}}"
        flush: false
        fields:
          done: "true"
          output_file: "PLANS.md"

  - id: flush
    type: script
    cmd: "python3 -c \"from src.engine.serializer import flush_departments; flush_departments({'{{inputs.department}}'})\""
