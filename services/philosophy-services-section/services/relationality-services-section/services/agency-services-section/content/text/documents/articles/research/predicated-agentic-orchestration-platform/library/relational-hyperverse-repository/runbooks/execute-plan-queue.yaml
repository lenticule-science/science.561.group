id: execute-plan-queue
description: "Work through open WorkItems for a department. Items with a runbook field are executed deterministically. Items without one are executed via the executor_runbook (LLM-backed)."
skill-closure-kind: procedure

inputs:
  - name: department
    type: str
  - name: executor_runbook
    type: str

steps:
  - id: load-queue
    type: query
    kind: WorkItem
    department: "{{inputs.department}}"
    where:
      status: open

  - id: execute-each
    type: for-each
    over: "{{load-queue.result}}"
    do:
      - id: run-item-runbook
        type: call
        condition: "{{item.runbook}}"
        runbook: "{{item.runbook}}"
        inputs:
          department: "{{inputs.department}}"
          item: "{{item}}"

      - id: run-executor
        type: call
        condition: "{{not item.runbook}}"
        runbook: "{{inputs.executor_runbook}}"
        inputs:
          department: "{{inputs.department}}"
          item: "{{item}}"

      - id: mark-done
        type: update
        unit_id: "{{item.id}}"
        flush: false
        fields:
          status: done

  - id: flush
    type: script
    cmd: "python3 -c \"from src.engine.serializer import flush_departments; flush_departments({'{{inputs.department}}'})\""
