id: bootstrap-context-files
description: "Ensure all six department context files exist (SOUL.md, AGENTS.md, MEMORY.md, INBOX.md, PLANS.md, IDEAS.md). Creates missing files with empty stubs. Idempotent."
skill-closure-kind: process

inputs:
  - name: department
    type: str

steps:
  - id: ensure-files
    type: script
    cmd: >
      python3 -c "
      from pathlib import Path
      dept = '{{inputs.department}}'
      base = Path('{{inputs.department}}') if dept != 'root' else Path('.')
      files = {
        'SOUL.md': '# SOUL.md\n\nPrinciples for the {dept} department.\n',
        'AGENTS.md': '# AGENTS.md\n\nAgent policies for the {dept} department.\n',
        'MEMORY.md': '# MEMORY.md\n\nMemory for the {dept} department.\n',
        'INBOX.md': '# INBOX.md\n\nInbox for the {dept} department.\n',
        'PLANS.md': '# PLANS.md\n\nWork items for the {dept} department.\n\n## Open\n',
        'IDEAS.md': '# IDEAS.md\n\nIdeas for the {dept} department.\n',
      }
      for name, stub in files.items():
        p = base / name
        if not p.exists():
          p.write_text(stub.format(dept=dept))
          print(f'created {p}')
        else:
          print(f'exists {p}')
      "
