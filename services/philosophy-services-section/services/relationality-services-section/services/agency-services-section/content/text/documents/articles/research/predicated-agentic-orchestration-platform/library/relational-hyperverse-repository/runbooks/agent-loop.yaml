id: agent-loop
description: "Runs the standard department improvement loop: bootstrap, triage INBOX, mine IDEAS, execute PLANS, compliance check, discovery. Loops until exit conditions hold. Use as the entry point for any department's improvement pass."
skill-closure-kind: procedure

inputs:
  - name: department
    type: str
  - name: executor_runbook
    type: str        # id of the runbook that executes one work item
  - name: compliance_skill
    type: str
    default: ""      # optional: path to compliance skill
  - name: discovery_skill
    type: str
    default: ""      # optional: path to discovery skill

outputs:
  - name: work_report
    from: "{{finish.result}}"

steps:
  - id: bootstrap
    type: call
    runbook: bootstrap-context-files
    inputs:
      department: "{{inputs.department}}"

  - id: triage
    type: call
    runbook: triage-inbox
    inputs:
      department: "{{inputs.department}}"

  - id: mine
    type: call
    runbook: mine-ideas-to-plans
    inputs:
      department: "{{inputs.department}}"

  - id: execute-loop
    type: call
    runbook: execute-plan-queue
    inputs:
      department: "{{inputs.department}}"
      executor_runbook: "{{inputs.executor_runbook}}"
      compliance_skill: "{{inputs.compliance_skill}}"
      discovery_skill: "{{inputs.discovery_skill}}"

  - id: finish
    type: call
    runbook: post-loop-report
    inputs:
      department: "{{inputs.department}}"
      triage_result: "{{triage.result}}"
      execute_result: "{{execute-loop.result}}"
