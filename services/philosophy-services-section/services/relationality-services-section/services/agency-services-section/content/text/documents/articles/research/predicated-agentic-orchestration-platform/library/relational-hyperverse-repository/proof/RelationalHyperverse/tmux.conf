# tmux configuration for the Relational Hyperverse dev box

# Use C-a as prefix (less conflict with terminal shortcuts than C-b)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Mouse support (essential for SSH from phone/tablet)
set -g mouse on

# Large scrollback
set -g history-limit 50000

# 256-color support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Intuitive split bindings (stay in current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded."

# Status bar
set -g status-interval 5
set -g status-left "[#S] "
set -g status-right "%Y-%m-%d %H:%M"
set -g status-left-length 20
