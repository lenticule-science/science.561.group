[project]
name = "emsemioverse"
version = "0.1.0"
description = "Semioverse repository and tooling."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.1",
    "fastapi>=0.128.0",
    "mkdocs-bibtex>=4.4.0",
    "mkdocs-macros-plugin>=1.5.0",
    "mkdocs-material>=9.7.1",
    "mkdocs-section-index>=0.3.10",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.10.0",
    "pymdown-extensions>=10.20",
    "uvicorn>=0.40.0",
    "mcp>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]
docs = [
    "mkdocs-bibtex>=4.4.0",
    "mkdocs-macros-plugin>=1.5.0",
    "mkdocs-material>=9.7.1",
    "mkdocs-section-index>=0.3.10",
    "pymdown-extensions>=10.20",
]

[tool.setuptools.packages.find]
include = ["engine*"]
