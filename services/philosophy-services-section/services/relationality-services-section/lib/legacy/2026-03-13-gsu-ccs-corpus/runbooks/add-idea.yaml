id: add-idea
description: "Add an idea to a department's IDEAS.md."
skill-closure-kind: process

inputs:
  - name: department
    type: str
  - name: text
    type: str

steps:
  - id: write-idea
    type: write
    kind: Idea
    department: "{{inputs.department}}"
    flush: true
    content:
      text: "{{inputs.text}}"
      done: false
      output_file: ""
