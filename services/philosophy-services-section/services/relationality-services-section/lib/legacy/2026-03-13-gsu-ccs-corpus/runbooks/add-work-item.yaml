id: add-work-item
description: "Add a WorkItem to a department's PLANS.md."
skill-closure-kind: process

inputs:
  - name: department
    type: str
  - name: identifier
    type: str
  - name: action
    type: str
  - name: why
    type: str
    default: ""

steps:
  - id: write-item
    type: write
    kind: WorkItem
    department: "{{inputs.department}}"
    flush: true
    content:
      identifier: "{{inputs.identifier}}"
      added: "{{today}}"
      status: open
      action: "{{inputs.action}}"
      why: "{{inputs.why}}"
      why_blocked: ""
