id: post-loop-report
description: "Summarize what happened during an agent loop run. Writes a MemoryEntry with the work report."
skill-closure-kind: process

inputs:
  - name: department
    type: str
  - name: triage_result
    type: dict
    default: {}
  - name: execute_result
    type: dict
    default: {}

steps:
  - id: write-memory
    type: write
    kind: MemoryEntry
    department: "{{inputs.department}}"
    flush: true
    content:
      date: "{{today}}"
      topic: "agent-loop run"
      body: "Triage: {{inputs.triage_result}}. Execute: {{inputs.execute_result}}."
