id: add-message
description: "Add a message to a department's INBOX.md."
skill-closure-kind: process

inputs:
  - name: department
    type: str
  - name: from_department
    type: str
  - name: subject
    type: str
  - name: body
    type: str
    default: ""
  - name: msg_type
    type: str
    default: GapFound   # FixNeeded | GapFound | Discovery
  - name: urgency
    type: str
    default: Normal     # Blocking | Normal | Low

steps:
  - id: write-message
    type: write
    kind: Message
    department: "{{inputs.department}}"
    flush: true
    content:
      from_department: "{{inputs.from_department}}"
      date: "{{today}}"
      msg_type: "{{inputs.msg_type}}"
      urgency: "{{inputs.urgency}}"
      subject: "{{inputs.subject}}"
      status: unread
      body: "{{inputs.body}}"
