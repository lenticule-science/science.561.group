id: laplacian-heat-wave
name: Laplacian Heat Wave Propagation
description: Compute Laplacian spectrum then propagate via heat and wave operators.
input_kind: PhaseSpace
output_kind: PhaseSpace
acts:
  - Laplacian
  - HeatKernel
  - WaveOperator
steps:
  - operator: Laplacian
    realizer: laplacian_operator
    input_kind: PhaseSpace
    output_kind: SpectralGeometry
    acts: ["Laplacian", "Spectrum"]
  - operator: HeatKernel
    realizer: heat_kernel
    input_kind: SpectralGeometry
    output_kind: PhaseSpace
    acts: ["HeatKernel", "FlowProfile"]
  - operator: WaveOperator
    realizer: wave_operator
    input_kind: PhaseSpace
    output_kind: PhaseSpace
    acts: ["WaveOperator", "FlowProfile"]
