abstract: |
  The Relational Hyperverse $\mathcal{H}$ is defined by a fixed-point equation:
  $\mathcal{H} = U_{\mathcal{H}}(\mathcal{H})$, where $U_{\mathcal{H}}$ is the
  Universe Closure operator — a four-phase construction (algebra $\to$ language
  $\to$ geometry $\to$ dynamics) applied at the meta-level. This treatise
  constructs the ground case of that equation in full.

  The ground case is the Relational Universe $R = \mathbf{Sh}(T, J)$, a
  Grothendieck topos on the history site $(T, J)$. Here $T = M(\Sigma, I)$ is
  the free partially commutative monoid of finite relational histories ordered
  by prefix extension, and $J$ is the Grothendieck topology generated by
  independence partitions of histories. The topos carries an internal
  Heyting-modal sheaf $H$ equipped with two commuting lax-idempotent monads —
  the saturation nucleus $\sigma$ and the transfer nucleus $\Delta$ — whose
  joint fixed-point subsheaf $H^\ast$ is the doubly quiescent layer of fully
  settled recognitions.

  Eight axioms govern the construction, distributed across four phases. Algebra
  establishes the history category and fiber Heyting algebras (two axioms).
  Language introduces $\mathrm{FML}_0$, a typed modal calculus whose terms
  name the sections of $H$, and proves strong normalization and soundness (one
  axiom). Geometry assembles the reindexing functor, the Grothendieck topology,
  and the ambient topos, and proves existence and uniqueness of $R$ (five
  axioms). Dynamics introduces the Universe Closure operator $U_G$ and proves
  the central result: $R = U_G(R)$. This is not an axiom but a consequence of
  the density theorem; $R$ is initial among all models of the eight axioms.

  The self-generation identity $R = U_G(R)$ is the base case of the Hyperverse
  tower: applying $U_\mathcal{H}$ to $R$ produces $R^{(1)} \supset R$;
  iterating produces the tower
  $R \hookrightarrow R^{(1)} \hookrightarrow R^{(2)} \hookrightarrow \cdots$;
  the colimit is $\mathcal{H}$. The full construction of $\mathcal{H}$ is the
  program to which this document is the first contribution.
