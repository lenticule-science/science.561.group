[project]
name = "PyMetroLogic"
version = "0.1.0"
description = "Information-tile mathematics for the 561 Group lab: predication, calculus, wilderness kernels, and earned RelMath numerics."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "UNLICENSED" }
authors = [{ name = "emsenn" }]
dependencies = ["numpy>=2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pymetrologic"]
