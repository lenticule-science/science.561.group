name = "RelMath"
version = "0.1.0"
defaultTargets = ["RelMath"]

# RelMath is dependency-free by mandate: NO [[require]] stanzas, no Mathlib.
# Everything is built from Lean 4 core (Init) only. The math content carries no
# free data past `Mark` and `Articulating`; every later stage is derived.

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
pp.unicode.fun = true

[[lean_lib]]
name = "RelMath"
