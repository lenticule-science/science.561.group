[project]
name = "pymetrologic-lab"
version = "0.0.0"
description = "561-group computational frontier-mathematics lab — realizing predication theory in Python"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "UNLICENSED" }
authors = [{ name = "emsenn" }]
dependencies = [
    "pymetrologic",
    "numpy>=2.1",
]

[project.optional-dependencies]
notebooks = [
    "jupytext>=1.16",
    "matplotlib>=3.9",
    "networkx>=3.3",
]
# NOTE on the meet-or-beat target: PySheaf (kb1dds/pysheaf) is GitHub-only and
# not published to PyPI, so it is NOT a declared dependency. Parity is proven by
# re-deriving its consistency-radius definition (see
# DiscreteGraphSheaf.classical_consistency_radius); the live cross-check
# (test_against_real_pysheaf_if_available) `importorskip`s it, so installing it
# manually from GitHub activates that path without changing resolution.

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/pymetrologic"]

[tool.uv.sources]
pymetrologic = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.108",
    "ruff>=0.6",
    "mypy>=1.11",
]

# ---------------------------------------------------------------------------
# Tooling — one source of truth for the whole workspace.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["packages/pymetrologic/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "RUF"]
ignore = [
    "E741",   # ambiguous names (l, L) are meaningful in lattice math
    "UP046",  # keep classic Generic[T] base (works cleanly with mypy strict)
    "UP047",  # keep classic TypeVar-based generic functions
]
# Genuine mathematical symbols and the en-dash used in Name–Name theorem pairs
# (Knaster–Tarski, Curry–Howard, …) — not typos; allow them in this corpus.
allowed-confusables = ["×", "⊤", "⊥", "∨", "∧", "∪", "∩", "∅", "∼", "−", "–", "≤", "≥", "↦", "→", "∘", "⋈", "⟨", "⟩", "ℕ", "ℤ", "ℒ", "ι", "κ", "ρ", "φ", "∣", "σ"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["B011"]
# Notebook idioms: imports mid-file, unused display imports, and bare
# last-expression cells that render as output.
"notebooks/*" = ["E402", "F401", "B018"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = ["packages/pymetrologic/src"]
files = ["packages/pymetrologic/src"]

# Optional visualization deps (the `notebooks` extra) ship incomplete stubs.
[[tool.mypy.overrides]]
module = ["matplotlib.*", "networkx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["packages/pymetrologic/tests"]
filterwarnings = ["error"]

[tool.jupytext]
formats = "ipynb,py:percent"

