<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Stationarity is an assumption to test</title>
<desc id="figure-description">A dashed indigo line suggests a stable baseline and a solid green line rises over the same illustrated progression. The curves are schematic, not data, probabilities or a forecast. Historical stability must be justified for the decision at hand.</desc>
<metadata>Original Lenticule Science explanatory diagram candidate, prepared 2026-10-30 from "Climate breakdown changes the baseline" (2026-10-22). No empirical values. Rights and final approval remain with the publishing office.</metadata>
