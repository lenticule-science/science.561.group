<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-labelledby="title desc">
  <title id="title">A parity boundary leaves two interiors per reading</title>
  <desc id="desc">The four equally likely interior states are 00, 11, 01 and 10. The parity boundary maps 00 and 11 to reading zero, and 01 and 10 to reading one. Each reading leaves two possible interiors, or one bit of conditional uncertainty under the stated uniform distribution. Recording A as well as parity allows exact reconstruction using B equals A exclusive-or parity.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#12635d"/></marker></defs>
  <rect width="640" height="720" rx="20" fill="#f3f8f6"/>
  <g font-family="system-ui, sans-serif" fill="#123431">
    <text x="32" y="46" font-size="27" font-weight="700">One relation, several possible interiors</text>
    <text x="32" y="79" font-size="20">Uniform two-bit example · P = A XOR B</text>
    <text x="67" y="128" font-size="22" font-weight="650">Interior (A, B)</text>
    <text x="432" y="128" font-size="22" font-weight="650">Readout P</text>
    <g fill="none" stroke="#12635d" stroke-width="3" marker-end="url(#arrow)">
      <path d="M204 191C312 191 319 235 426 235"/><path d="M204 280C312 280 319 235 426 235"/>
      <path d="M204 384C312 384 319 428 426 428"/><path d="M204 473C312 473 319 428 426 428"/>
    </g>
    <g fill="#fff" stroke="#91aaa1" stroke-width="2"><rect x="64" y="160" width="140" height="62" rx="10"/><rect x="64" y="249" width="140" height="62" rx="10"/><rect x="64" y="353" width="140" height="62" rx="10"/><rect x="64" y="442" width="140" height="62" rx="10"/></g>
    <g fill="#e1f1eb" stroke="#12635d" stroke-width="2"><rect x="433" y="192" width="124" height="86" rx="12"/><rect x="433" y="385" width="124" height="86" rx="12"/></g>
    <g font-size="29" text-anchor="middle" font-weight="650"><text x="134" y="201">00</text><text x="134" y="290">11</text><text x="134" y="394">01</text><text x="134" y="483">10</text><text x="495" y="245">0</text><text x="495" y="438">1</text></g>
    <text x="320" y="545" text-anchor="middle" font-size="23">Two interiors per reading.</text>
    <text x="320" y="579" text-anchor="middle" font-size="23">H(A, B | P) = 1 bit for this distribution.</text>
    <rect x="24" y="605" width="592" height="91" rx="12" fill="#fff1ce" stroke="#a36b19"/>
    <text x="320" y="639" text-anchor="middle" font-size="22" font-weight="650">Add the observation A: record (A, P).</text>
    <text x="320" y="674" text-anchor="middle" font-size="22">Then B = A XOR P, so reconstruction is exact.</text>
  </g>
</svg>
