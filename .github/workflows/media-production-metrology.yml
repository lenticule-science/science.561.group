name: Lenticule original cinema production metrology
on:
  push:
    paths:
      - 'services/information-science-services-section/services/communication-science-services-section/services/media-science-services-section/src/production-duration-metrology.mjs'
      - 'services/information-science-services-section/services/communication-science-services-section/services/media-science-services-section/apps/measure-production-duration.mjs'
      - 'services/information-science-services-section/services/communication-science-services-section/services/media-science-services-section/test/production-duration-metrology.test.mjs'
      - '.github/workflows/media-production-metrology.yml'
  pull_request:
    paths:
      - 'services/information-science-services-section/services/communication-science-services-section/services/media-science-services-section/src/production-duration-metrology.mjs'
      - 'services/information-science-services-section/services/communication-science-services-section/services/media-science-services-section/apps/measure-production-duration.mjs'
      - 'services/information-science-services-section/services/communication-science-services-section/services/media-science-services-section/test/production-duration-metrology.test.mjs'
      - '.github/workflows/media-production-metrology.yml'
permissions:
  contents: read
jobs:
  evidence-science:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify actual accepted, rejected and censored cinematic labor measurements
        run: |
          node --check services/information-science-services-section/services/communication-science-services-section/services/media-science-services-section/src/production-duration-metrology.mjs
          node --check services/information-science-services-section/services/communication-science-services-section/services/media-science-services-section/apps/measure-production-duration.mjs
          node --test services/information-science-services-section/services/communication-science-services-section/services/media-science-services-section/test/production-duration-metrology.test.mjs
