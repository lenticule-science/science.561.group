name: Agent work
on:
  push:
    branches: ['**']
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: agent-work-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  receive:
    if: github.event_name != 'push' || (github.ref_name != github.event.repository.default_branch && !github.event.deleted)
    uses: red-cup-engineering/continuous-delivery-services-section/.github/workflows/agent-work.yml@92c951052f20a056ba2a5a31f772938afdfab8f0
    with:
      runs-on: '["ubuntu-latest"]'
