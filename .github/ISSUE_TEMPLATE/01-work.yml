name: "Work — demand and receiver"
description: "Request one bounded, independently receivable outcome."
title: "[Work] "
body:
  - type: markdown
    attributes:
      value: |
        First check whether an existing issue or pull request already carries this work.
        Record the beneficiary and observable result, not a guessed implementation.
        Never paste credentials or private customer data.
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What must change in the real system or service?
      placeholder: "The receiver can..."
    validations:
      required: true
  - type: input
    id: receiver
    attributes:
      label: Independent receiver
      description: Who or what can verify the delivered effect?
      placeholder: "Office, agent, customer, or installed consumer"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: Name the observable success and a meaningful failure or refusal case.
    validations:
      required: true
  - type: textarea
    id: existing
    attributes:
      label: Existing work, sources, and constraints
      description: Link related issues/PRs, source owner, revisions, standards, permission and cost limits if known.
