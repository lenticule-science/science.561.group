{{ define "main" }}
{{ partial "breadcrumbs.html" . }}
<h1 class="p-name">{{ .Title }}</h1>
<div class="h-feed">
{{ .Content }}
{{ with .Pages.ByDate.Reverse }}
<ul class="pages">
  {{ range . }}
  <li><a href="{{ .RelPermalink }}">{{ or .Title (.File.ContentBaseName | humanize) }}</a>{{ with .Date }} <span class="meta">{{ .Format "2006-01-02" }}</span>{{ end }}</li>
  {{ end }}
</ul>
{{ end }}
</div>
{{ end }}
