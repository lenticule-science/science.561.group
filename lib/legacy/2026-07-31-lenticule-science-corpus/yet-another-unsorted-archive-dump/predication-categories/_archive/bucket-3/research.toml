# Configuration for the engineering/tools/research/math toolkit.
# Tools auto-discover this file by walking up from CWD; pass --root to override.

[program]
title = "Spatiotemporal Knowledge"
subtitle = "A monograph on bilattice hyperdoctrines, cascade cohomology, and moduli"

[corpus]
lib_dirs = [
    "concepts", "objects", "morphisms", "theorems",
    "examples", "narratives", "questions", "references",
]
bib = "references.bib"

[validate]
min_body_chars = 200
lean_dir = "lean"

[compose]
output = "publications/monograph.md"
