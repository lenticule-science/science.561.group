theme: 'material'


extra:
  feature:
    tabs: true
  palette:
    primary: 'light blue'
    accent: 'amber'
  font:
    text: 'Comfortaa'
    code: 'Cousine'
  social:
    - type: 'github'
      link: 'https://github.com/emsenn'
    - type: 'twitter'
      link: 'https://twitter.com/emsenn'
    - type: 'linkedin'
      link: 'https://www.linkedin.com/in/emsenn/'
    
markdown_extensions:
  - admonition
  - codehilite:
        guess_lang: false
        linenums: true
  - toc(permalink=true)
  - markdown_include.include::
        base_path: docs
  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
