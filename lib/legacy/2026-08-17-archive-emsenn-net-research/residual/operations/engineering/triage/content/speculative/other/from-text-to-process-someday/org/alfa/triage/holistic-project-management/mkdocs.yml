site_name: Holistic Project Management 
site_description: A system-agnostic project management method.
site_author: emsenn
repo_name: 'source'
repo_url: https://gitlab.com/emsenn/holistic-project-management/
pages:
    - Home: index.md
theme:
    name: 'material'
    palette:
        primary: 'grey'
        accent: 'teal'
    feature:
        tabs: true
    font:
        text: 'Montserrat'
        code: 'Ubuntu Mono'
markdown_extensions:
    - admonition
    - codehilite:
        guess_lang: false
    - toc:
        permalink: true
