id: system-trace
name: System Trace Advance
description: Maintain trace correctness after each interaction.
input_kind: Trace
output_kind: Trace
acts:
  - StartTrace
  - ContinueTrace
  - AdvanceTrace
  - StabilizeTrace
  - TraceReentryClosure
steps:
  - operator: StartTrace
    realizer: start_trace
    description: Initialize trace carrier if needed.
    input_kind: Trace
    output_kind: Trace
    acts: ["StartTrace"]
  - operator: ContinueTrace
    realizer: advance_trace
    description: Append latest operator visitation into the trace carrier.
    input_kind: Trace
    output_kind: Trace
    acts: ["ContinueTrace", "AdvanceTrace", "RestepTrace"]
  - operator: StabilizeTrace
    realizer: stabilize_trace
    description: Mark trace as stabilized after append.
    input_kind: Trace
    output_kind: Trace
    acts: ["StabilizeTrace", "TraceReentryClosure"]
