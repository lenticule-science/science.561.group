{{ if .Pages}}
  <ul>
    {{ $data := .Data }}
    {{ range $key, $value := .Data.Terms.ByCount }}
      <li>
        <a href="/{{ $data.Plural }}/{{ $value.Name | urlize }}">
          {{ $value.Name | humanize }}
        </a>
        <strong>{{ .Count }}</strong> pages
      </li>
    {{ end }}
  </ul>
{{ end }}
