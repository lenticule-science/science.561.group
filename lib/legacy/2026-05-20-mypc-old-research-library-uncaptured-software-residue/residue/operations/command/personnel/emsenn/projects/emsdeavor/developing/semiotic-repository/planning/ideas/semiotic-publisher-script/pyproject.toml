[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ssc-universe"
version = "0.1.0"
description = "Stewardable Semiotic Concept Universe publisher"
authors = [{name="Relationality Agents"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml",
  "markdown-it-py",
  "jinja2",
  "bleach",
]

[project.scripts]
sscu = "ssc_universe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--capture=no"
