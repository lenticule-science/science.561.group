openapi: 3.0.0
info:
  title: Relational Core API
  version: 0.1.0
  description: |
    Conceptual OpenAPI description of services that the relational_core
    library could expose over HTTP. This is a documentation artefact
    for the Treatise-on-Relationality project and is not currently
    backed by a running HTTP server.
paths:
  /semantics/sequent-valid:
    post:
      summary: Check sequent validity in a finite model
      description: >
        Given a list of assumption types and a conclusion type,
        together with a chosen finite model (e.g. BoolHA or ThreeHA),
        determine whether the sequent Γ ⊢ A holds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                  enum: [BoolHA, ThreeHA]
                assumptions:
                  type: array
                  items:
                    type: string
                    description: λ_R type encoded as a string
                conclusion:
                  type: string
                  description: λ_R type encoded as a string
              required: [model, assumptions, conclusion]
      responses:
        '200':
          description: Result of the validity check
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
  /proof/inhabited:
    post:
      summary: Check inhabitation in the implicational fragment
      description: >
        Given an implicational λ_R type and a search depth, attempt to
        find a proof term inhabiting the type using a small proof
        search procedure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: Implicational λ_R type encoded as a string
                maxDepth:
                  type: integer
                  minimum: 0
                  default: 3
              required: [type]
      responses:
        '200':
          description: Result of inhabitation check
          content:
            application/json:
              schema:
                type: object
                properties:
                  inhabited:
                    type: boolean
