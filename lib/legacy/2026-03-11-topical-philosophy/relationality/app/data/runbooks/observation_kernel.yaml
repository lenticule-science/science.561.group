id: observation-kernel
name: Observation Kernel Application
description: Apply observation kernel and transition law to a PhaseSpace carrier.
input_kind: PhaseSpace
output_kind: PhaseSpace
acts:
  - ObservationKernel
  - TransitionLaw
steps:
  - operator: ObservationKernel
    realizer: observation_kernel
    input_kind: PhaseSpace
    output_kind: PhaseSpace
    acts: ["ObservationKernel", "FlowMeasureStep"]
  - operator: TransitionLaw
    realizer: transition_law
    input_kind: PhaseSpace
    output_kind: PhaseSpace
    acts: ["TransitionLaw", "FlowProfile"]
