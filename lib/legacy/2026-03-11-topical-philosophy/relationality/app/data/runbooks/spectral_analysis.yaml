id: spectral-analysis
name: Spectral Analysis
description: Spectral pipeline mapping PhaseSpace to spectral diagnostics and harmonic modes.
input_kind: PhaseSpace
output_kind: FixedInvariant
acts:
  - Laplacian
  - HarmonicMode
steps:
  - operator: Laplacian
    realizer: laplacian_operator
    description: Compute Laplacian spectrum from phase space adjacency.
    input_kind: PhaseSpace
    output_kind: SpectralGeometry
    acts: ["Laplacian", "Spectrum"]
  - operator: HarmonicMode
    realizer: harmonic_mode
    description: Extract harmonic mode fixed invariant from spectral geometry.
    input_kind: SpectralGeometry
    output_kind: FixedInvariant
    acts: ["HarmonicMode", "FixedInvariant"]
